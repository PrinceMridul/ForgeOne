version: '3.9'
name: forgeone
services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeone-postgres
    restart: unless-stopped
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: forgeone
      POSTGRES_PASSWORD: forgeone
      POSTGRES_DB: forgeone
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgeone']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: forgeone-redis
    restart: unless-stopped
    ports: ['6379:6379']
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: forgeone-qdrant
    restart: unless-stopped
    ports: ['6333:6333', '6334:6334']
    volumes: [qdrant-data:/qdrant/storage]
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
  minio:
    image: minio/minio:latest
    container_name: forgeone-minio
    restart: unless-stopped
    ports: ['9000:9000', '9001:9001']
    environment:
      MINIO_ROOT_USER: forgeone
      MINIO_ROOT_PASSWORD: forgeone-secret
    volumes: [minio-data:/data]
    command: server /data --console-address ':9001'
volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
