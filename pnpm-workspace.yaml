packages:
  - "apps/*"
  - "packages/*"
  # apps/web_old is the superseded Next.js frontend, fully replaced by the
  # TanStack Start app in apps/web. Nothing imports it, and its type-check
  # fails in a clean checkout because it depends on generated .next/types
  # that only exist after a Next build. Excluded so it stops breaking
  # `turbo lint/type-check/build`; the source is retained on disk and in
  # git history for reference.
  - "!apps/web_old"
